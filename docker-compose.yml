services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumi}
      POSTGRES_DB: ${POSTGRES_DB:-sumi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Defaults to the bundled Postgres; set DATABASE_URL in .env to use Neon/remote instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://sumi:sumi@db:5432/sumi}

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      # Live-mount static assets so mascot/demo changes appear without a rebuild.
      - ./public:/app/public
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sumi:sumi@db:5432/sumi}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3005}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
