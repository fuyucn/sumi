<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="paper4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#f3efe4"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1e1b16" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="680" fill="url(#paper4)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#b3402e"/>

  <text x="48" y="52" font-size="26" font-weight="700" fill="#1e1b16">部署拓扑：一套代码，三种目标</text>
  <text x="48" y="78" font-size="14" fill="#6b655c">共享 next.config.ts（standalone）与同一份 zod env schema · ContentStore 按开关切换</text>

  <!-- Docker -->
  <g filter="url(#shadow4)">
    <rect x="48" y="110" width="380" height="440" rx="14" fill="#ffffff" stroke="#1e1b16" stroke-opacity="0.15"/>
    <rect x="48" y="110" width="380" height="40" rx="14" fill="#1e1b16"/>
    <rect x="48" y="130" width="380" height="20" fill="#1e1b16"/>
    <text x="238" y="136" font-size="13" font-weight="700" fill="#f7f4ec" text-anchor="middle"> Docker 一键（推荐本地）</text>
    <text x="238" y="180" font-size="11" fill="#6b655c" text-anchor="middle">docker compose up -d --build</text>
    <rect x="80" y="200" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="238" y="220" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">db · postgres:16-alpine</text>
    <text x="238" y="238" font-size="11" fill="#6b655c" text-anchor="middle">healthcheck + pgdata 卷</text>
    <rect x="80" y="266" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="238" y="286" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">migrate · drizzle-kit</text>
    <text x="238" y="304" font-size="11" fill="#6b655c" text-anchor="middle">one-shot，成功才起 app</text>
    <rect x="80" y="332" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="238" y="352" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">app · Next standalone</text>
    <text x="238" y="370" font-size="11" fill="#6b655c" text-anchor="middle">:3005 → 容器 :3000（uid 1001）</text>
    <rect x="80" y="398" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="238" y="418" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">DB_MIRROR=1</text>
    <text x="238" y="436" font-size="11" fill="#6b655c" text-anchor="middle">内容主存储 = 内置 Postgres</text>
    <rect x="80" y="464" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="238" y="484" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">零配置开箱即用</text>
    <text x="238" y="502" font-size="11" fill="#6b655c" text-anchor="middle">curl localhost:3005 = 200</text>
  </g>

  <!-- VPS -->
  <g filter="url(#shadow4)">
    <rect x="450" y="110" width="380" height="440" rx="14" fill="#ffffff" stroke="#1e1b16" stroke-opacity="0.15"/>
    <rect x="450" y="110" width="380" height="40" rx="14" fill="#1e1b16"/>
    <rect x="450" y="130" width="380" height="20" fill="#1e1b16"/>
    <text x="640" y="136" font-size="13" font-weight="700" fill="#f7f4ec" text-anchor="middle"> 自定义 VPS</text>
    <text x="640" y="180" font-size="11" fill="#6b655c" text-anchor="middle">bash scripts/deploy-vps.sh</text>
    <rect x="482" y="200" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="640" y="220" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">幂等安装</text>
    <text x="640" y="238" font-size="11" fill="#6b655c" text-anchor="middle">Node / pnpm / PM2</text>
    <rect x="482" y="266" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="640" y="286" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">构建 + 迁移</text>
    <text x="640" y="304" font-size="11" fill="#6b655c" text-anchor="middle">pnpm build · db:migrate</text>
    <rect x="482" y="332" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="640" y="352" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">自有 Postgres / Neon</text>
    <text x="640" y="370" font-size="11" fill="#6b655c" text-anchor="middle">sumi_* 内容表</text>
    <rect x="482" y="398" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="640" y="418" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">PM2 常驻运行</text>
    <text x="640" y="436" font-size="11" fill="#6b655c" text-anchor="middle">进程守护 + 自动重启</text>
    <rect x="482" y="464" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="640" y="484" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">DB_MIRROR=1</text>
    <text x="640" y="502" font-size="11" fill="#6b655c" text-anchor="middle">与 Docker 同一运行时模型</text>
  </g>

  <!-- Cloudflare -->
  <g filter="url(#shadow4)">
    <rect x="852" y="110" width="380" height="440" rx="14" fill="#ffffff" stroke="#b3402e" stroke-opacity="0.5"/>
    <rect x="852" y="110" width="380" height="40" rx="14" fill="#b3402e"/>
    <rect x="852" y="130" width="380" height="20" fill="#b3402e"/>
    <text x="1042" y="136" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"> Cloudflare（免费首选）</text>
    <text x="1042" y="180" font-size="11" fill="#6b655c" text-anchor="middle">pnpm cf:build &amp;&amp; pnpm cf:deploy</text>
    <rect x="884" y="200" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="1042" y="220" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">OpenNext Worker</text>
    <text x="1042" y="238" font-size="11" fill="#6b655c" text-anchor="middle">Next standalone → Worker</text>
    <rect x="884" y="266" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="1042" y="286" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">D1 绑定 DB</text>
    <text x="1042" y="304" font-size="11" fill="#6b655c" text-anchor="middle">会话 + 内容（CF_ENABLED=1）</text>
    <rect x="884" y="332" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="1042" y="352" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">R2 绑定 IMAGES</text>
    <text x="1042" y="370" font-size="11" fill="#6b655c" text-anchor="middle">图片 + OpenNext 缓存</text>
    <rect x="884" y="398" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="1042" y="418" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">drizzle/d1-schema.sql</text>
    <text x="1042" y="436" font-size="11" fill="#6b655c" text-anchor="middle">D1 专用 DDL 建表</text>
    <rect x="884" y="464" width="316" height="54" rx="10" fill="#f7f4ec" stroke="#1e1b16" stroke-opacity="0.2"/>
    <text x="1042" y="484" font-size="12" font-weight="600" fill="#1e1b16" text-anchor="middle">GitHub OAuth 保持不变</text>
    <text x="1042" y="502" font-size="11" fill="#6b655c" text-anchor="middle">同一认证流程 / allowlist</text>
  </g>

  <text x="640" y="590" font-size="13" font-weight="600" fill="#1e1b16" text-anchor="middle">三条路径共享：ContentStore 抽象 · zod env 校验 · GitHub 登录 · Agent MCP 发布</text>
  <text x="640" y="620" font-size="12" fill="#6b655c" text-anchor="middle">本地开发用 Docker（:3005 人工验收）→ 稳定后推 Cloudflare 免费托管 → 高要求自建 VPS</text>
  <text x="640" y="652" font-size="11" fill="#b3402e" text-anchor="middle">随时可切换：只改 env（CF_ENABLED / DB_MIRROR / DATABASE_URL），代码零改动</text>
</svg>
